            const next = [...prev];
            next[index] = { ...next[index], quantity: (next[index].quantity || 1) + 1 };
            return next;

            itemKey,
            id: product.id,
            title: product.title,
            priceFCFA: product.priceFCFA,
            image: product.image,
            shade,
            clasp,
            quantity: 1

        });

        setIsCartOpen(true);

        setCart(prev => {
          return prev.map(item => {
            if (item.itemKey === itemKey) {
              const newQty = (item.quantity || 1) + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });

                <div className="w-screen max-w-md bg-surface-container-lowest shadow-2xl flex flex-col justify-between border-l border-outline-variant/30 animate-fadeIn">
                  
                  {/* Haut du Panier */}
                  <div className="p-5 border-b border-outline-variant/20 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="material-symbols-outlined text-primary text-[22px]">shopping_bag</span>
                      <h3 className="font-headline-sm text-xl text-primary font-bold">Mon Écrin Panier</h3>
                      <span className="px-2 py-0.5 rounded-full bg-surface-container text-primary font-bold text-xs">
                        {cartCount}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsCartOpen(false)}
                      className="p-1.5 rounded-full text-outline hover:text-primary transition-colors"
                    >
                      <span className="material-symbols-outlined text-[20px]">close</span>
                    </button>
                  </div>

                  {/* Liste des Articles */}
                  <div className="flex-1 overflow-y-auto p-5 space-y-4">
                    {cart.length === 0 ? (
                      <div className="py-16 text-center text-on-surface-variant space-y-3">
                        <span className="material-symbols-outlined text-[48px] text-outline-variant">shopping_bag</span>
                        <p className="font-headline-sm text-lg text-primary font-semibold">Votre panier est vide</p>
                        <p className="text-xs">Découvrez nos créations faites main et ajoutez vos coups de cœur !</p>
                        <button
                          type="button"
                          onClick={() => { setIsCartOpen(false); window.location.hash = '#boutique'; }}
                          className="px-5 py-2.5 rounded-full bg-primary-container text-white text-xs font-bold shadow-sm"
                        >
                          Explorer la boutique
                        </button>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div
                          key={item.itemKey}
                          className="p-3.5 rounded-2xl bg-surface-container border border-outline-variant/30 flex gap-3.5 items-center justify-between"
                        >
                          <img
                            src={item.image}
                            alt={item.title}
                            className="w-16 h-16 rounded-xl object-cover shrink-0 border border-outline-variant/30"
                          />
                          <div className="min-w-0 flex-1">
                            <h4 className="font-headline-sm text-xs font-bold text-primary truncate">{item.title}</h4>
                            <p className="text-[11px] text-on-surface-variant">Nuance : <span className="font-semibold text-primary">{item.shade}</span></p>
                            <p className="text-xs font-bold text-primary-container mt-0.5">
                              {(item.priceFCFA * item.quantity).toLocaleString('fr-FR')} FCFA
                            </p>
                          </div>

                          <div className="flex flex-col items-end gap-1.5 shrink-0">
                            <div className="flex items-center gap-1 bg-surface-container-lowest rounded-full border border-outline-variant/30 px-1 py-0.5">
                              <button
                                type="button"
                                onClick={() => updateCartQty(item.itemKey, -1)}
                                className="w-5 h-5 flex items-center justify-center text-primary font-bold hover:bg-surface-container rounded-full text-xs"
                              >
                                -
                              </button>
                              <span className="text-xs font-bold px-1.5">{item.quantity}</span>
                              <button
                                type="button"
                                onClick={() => updateCartQty(item.itemKey, 1)}
                                className="w-5 h-5 flex items-center justify-center text-primary font-bold hover:bg-surface-container rounded-full text-xs"
                              >
                                +
                              </button>
                            </div>

                            <button
                              type="button"
                              onClick={() => removeFromCart(item.itemKey)}
                              className="text-[10px] text-error hover:underline"
                            >
                              Supprimer
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Bas du Panier & Validation */}
                  {cart.length > 0 && (
                    <div className="p-5 border-t border-outline-variant/20 bg-surface-container-lowest space-y-3">
                      
                      {/* Option Cadeau */}
                      <div className="p-3 rounded-xl bg-surface-container-low border border-outline-variant/20 space-y-2">
                        <label className="flex items-center gap-2 cursor-pointer text-xs text-primary font-semibold">
                          <input
                            type="checkbox"
                            checked={isGiftOption}
                            onChange={(e) => setIsGiftOption(e.target.checked)}
                            className="accent-tertiary-container rounded w-4 h-4"
                          />
                          <span>🎁 C'est pour offrir (écrin calligraphié)</span>
                        </label>
                        {isGiftOption && (
                          <textarea
                            rows="2"
                            value={giftNote}
                            onChange={(e) => setGiftNote(e.target.value)}
                            placeholder="Écrivez le mot doux à joindre..."
                            className="w-full text-xs p-2 rounded-lg bg-surface-container border border-outline-variant/30 text-on-surface focus:outline-none"
                          />
                        )}
                      </div>

                      {/* Rappel Frais de Livraison */}
                      <div className="p-3 rounded-xl bg-amber-50 border border-amber-200/80 text-amber-900 text-[11px] leading-snug">
                        <p className="font-bold flex items-center gap-1">
                          <span className="material-symbols-outlined text-[14px]">local_shipping</span>
                          <span>Livraison payante à la charge du client</span>
                        </p>
                        <p className="text-[10px] text-amber-800 mt-0.5">Le montant du coursier sera calculé selon votre ville/quartier lors de l'échange WhatsApp.</p>
                      </div>

                      {/* Total */}
                      <div className="flex items-baseline justify-between pt-1">
                        <span className="text-xs uppercase font-bold text-on-surface-variant">Total des Articles</span>
                        <span className="font-headline-md text-2xl font-bold text-primary">
                          {cartTotalFCFA.toLocaleString('fr-FR')} FCFA
                        </span>
                      </div>

                      {/* Bouton de Validation WhatsApp */}
                      <a
                        href={getWhatsAppOrderUrl()}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full py-3.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-label-button text-sm font-bold shadow-md transition-all flex items-center justify-center gap-2"
                      >
                        <span className="material-symbols-outlined text-[18px]">chat</span>
                        <span>Valider ma commande sur WhatsApp</span>
                      </a>
                    </div>
                  )}

                </div>
              </aside>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODALE QUICKVIEW PRODUIT : ADMIRER & COMMANDER            */}
          {/* ========================================================= */}
          {quickviewProduct && (
            <div className="fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 flex items-center justify-center">
              <div
                onClick={() => setQuickviewProduct(null)}
                className="fixed inset-0 bg-primary/50 backdrop-blur-sm"
              ></div>

              <div className="relative bg-surface-container-lowest rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-outline-variant/30 z-10 animate-fadeIn">
                <button
                  type="button"
                  onClick={() => setQuickviewProduct(null)}
                  className="absolute top-4 right-4 w-9 h-9 rounded-full bg-surface-container hover:bg-surface-container-high text-primary flex items-center justify-center"
                >
                  <span className="material-symbols-outlined text-[18px]">close</span>
                </button>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
                  {/* Photo & Zoom */}
                  <div className="space-y-3">
                    <div
                      onClick={() => setLightboxImg(quickviewProduct.image)}
                      className="aspect-square rounded-2xl overflow-hidden bg-surface-container cursor-zoom-in relative border border-outline-variant/30"
                    >
                      <img
                        src={quickviewProduct.image}
                        alt={quickviewProduct.title}
                        className="w-full h-full object-cover"
                      />
                      <span className="absolute bottom-2 right-2 bg-black/50 text-white p-1 rounded-md text-xs flex items-center">
                        <span className="material-symbols-outlined text-[14px]">zoom_in</span>
                      </span>
                    </div>

                    {/* Miniatures */}
                    {quickviewProduct.thumbnails && (
                      <div className="flex items-center gap-2 overflow-x-auto py-1">
                        {quickviewProduct.thumbnails.map((t, idx) => (
                          <img
                            key={idx}
                            src={t}
                            alt="Miniature"
                            onClick={() => setLightboxImg(t)}
                            className="w-12 h-12 rounded-lg object-cover cursor-pointer border border-outline-variant/40 hover:scale-105 transition-transform"
                          />
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Descriptif & Achat */}
                  <div className="space-y-4">
                    <div>
                      <span className="text-[10px] uppercase font-bold text-tertiary-container tracking-wider block mb-1">
                        {quickviewProduct.badge}
                      </span>
                      <h3 className="font-headline-sm text-2xl text-primary font-bold leading-tight">
                        {quickviewProduct.title}
                      </h3>
                      <p className="font-headline-sm text-xl text-primary-container font-bold mt-1">
                        {quickviewProduct.priceFCFA.toLocaleString('fr-FR')} FCFA
                      </p>
                    </div>

                    <p className="text-xs text-on-surface-variant leading-relaxed">
                      {quickviewProduct.quote || quickviewProduct.subtitle}
                    </p>

                    {/* Choix nuance */}
                    {quickviewProduct.shades && (
                      <div>
                        <label className="block text-[11px] font-bold uppercase text-on-surface-variant mb-1.5">
                          Couleur / Nuance : <span className="text-primary">{selectedShade}</span>
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {quickviewProduct.shades.map((s, idx) => (
                            <button
                              key={idx}
                              type="button"
                              onClick={() => setSelectedShade(s.name)}
                              className={`px-3 py-1 rounded-full text-xs flex items-center gap-1.5 border ${
                                selectedShade === s.name
                                  ? 'border-primary bg-primary text-white font-bold'
                                  : 'border-outline-variant/40 bg-surface-container text-primary'
                              }`}
                            >
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: s.color }}></span>
                              <span>{s.name}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Choix attache */}
                    <div>
                      <label className="block text-[11px] font-bold uppercase text-on-surface-variant mb-1.5">Type d'attache</label>
                      <select
                        value={selectedClasp}
                        onChange={(e) => setSelectedClasp(e.target.value)}
                        className="w-full text-xs p-2 rounded-xl bg-surface-container border border-outline-variant/30 text-primary font-medium focus:outline-none"
                      >
                        <option value="Crochets dorés hypoallergéniques">Crochets dorés hypoallergéniques</option>
                        <option value="Clips confort (oreilles non percées)">Clips confort (oreilles non percées)</option>
                        <option value="Clous avec perle">Clous avec perle</option>
                      </select>
                    </div>

                    {/* Boutons Action */}
                    <div className="pt-2 flex flex-col gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          addToCart(quickviewProduct, selectedShade);
                          setQuickviewProduct(null);
                        }}
                        className="w-full py-3 rounded-full bg-primary-container hover:bg-primary text-white text-xs font-bold shadow-md transition-all flex items-center justify-center gap-2"
                      >
                        <span className="material-symbols-outlined text-[16px]">add_shopping_cart</span>
                        <span>Ajouter à mon panier</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          orderSingleProductWhatsApp(quickviewProduct, selectedShade);
                          setQuickviewProduct(null);
                        }}
                        className="w-full py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition-all flex items-center justify-center gap-1.5"
                      >
                        <span className="material-symbols-outlined text-[16px]">chat</span>
                        <span>Commander sur WhatsApp</span>
                      </button>
                    </div>

                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODALE ZOOM PHOTO MACRO                                   */}
          {/* ========================================================= */}
          {lightboxImg && (
            <div
              onClick={() => setLightboxImg(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out animate-fadeIn"
            >
              <button
                type="button"
                onClick={() => setLightboxImg(null)}
                className="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/40"
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
              <img
                src={lightboxImg}
                alt="Aperçu grand format"
                className="max-h-[90vh] max-w-[90vw] object-contain rounded-2xl shadow-2xl"
              />
            </div>
          )}

          {/* ========================================================= */}
          {/* MODALE MENTIONS / CGV / LIVRAISON                         */}
          {/* ========================================================= */}
          {termsModal && (
            <div className="fixed inset-0 z-50 overflow-y-auto p-4 sm:p-6 flex items-center justify-center">
              <div onClick={() => setTermsModal(null)} className="fixed inset-0 bg-primary/50 backdrop-blur-sm"></div>
              <div className="relative bg-surface-container-lowest rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-outline-variant/30 z-10 text-xs text-on-surface-variant space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between pb-3 border-b border-outline-variant/20">
                  <h3 className="font-headline-sm text-xl text-primary font-bold">
                    {termsModal === 'livraison' && "Modalités de Livraison"}
                    {termsModal === 'cgv' && "Conditions Générales de Vente"}
                    {termsModal === 'mentions' && "Mentions Légales & Données"}
                  </h3>
                  <button onClick={() => setTermsModal(null)} className="p-1.5 rounded-full hover:bg-surface-container">
                    <span className="material-symbols-outlined text-[18px]">close</span>
                  </button>
                </div>

                {termsModal === 'livraison' && (
                  <div className="space-y-3 leading-relaxed">
                    <p><strong>1. Livraison par coursier (Cotonou &amp; Calavi) :</strong> Livré directement à votre domicile ou bureau sous 24h à 48h ouvrées. La livraison est payante et à la charge exclusive du client (tarif fixé selon le quartier ou commune).</p>
                    <p><strong>2. Autres villes du Bénin :</strong> Acheminement par transporteurs agréés ou poste sécurisée. Frais de port payants à la charge du client.</p>
                    <p><strong>3. International &amp; Diaspora :</strong> Expéditions vers l'Afrique de l'Ouest, l'Europe et l'Amérique du Nord par services postaux recommandés ou DHL express. Frais à la charge du destinataire.</p>
                    <p className="p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200 font-medium">⚠️ Rappel : Aucune remise en main propre n'est organisée à l'atelier.</p>
                  </div>
                )}

                {termsModal === 'cgv' && (
                  <div className="space-y-3 leading-relaxed">
                    <p><strong>1. Confection artisanale :</strong> Chaque pièce est réalisée à la main à Cotonou. De subtiles variations témoignent de son authenticité fait main.</p>
                    <p><strong>2. Règlements acceptés :</strong> Mobile Money (MTN MoMo, Moov Money), virement ou espèces à la livraison auprès du coursier (frais de coursier à la charge du client).</p>
                    <p><strong>3. Échanges :</strong> Pour les modèles en stock non portés, échange possible sous 48h dans leur écrin d'origine.</p>
                  </div>
                )}

                {termsModal === 'mentions' && (
                  <div className="space-y-3 leading-relaxed">
                    <p><strong>Marque :</strong> CROKÉA — Boucles d'oreilles faites main | Crochet &amp; perles.</p>
                    <p><strong>Siège &amp; Atelier :</strong> Cotonou, République du Bénin.</p>
                    <p><strong>Contact :</strong> +229 01 40 82 04 73 / +229 01 44 09 69 15.</p>
                    <p><strong>Conception web &amp; Déploiement :</strong> Amour Govoetchan.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* TOAST DE CONFIRMATION FLOTTANT                            */}
          {/* ========================================================= */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-primary-container text-white px-5 py-3 rounded-full shadow-2xl text-xs font-bold flex items-center gap-2 border border-white/20 animate-fadeIn">
              <span className="material-symbols-outlined text-[18px] text-emerald-400">check_circle</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* ========================================================= */}
          {/* FOOTER CLASSIQUE & ÉLÉGANT                                */}
          {/* ========================================================= */}
          <footer className="w-full bg-surface-container-high/60 border-t border-outline-variant/30 pt-12 pb-8 text-on-surface-variant">
            <div className="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-8 pb-10 border-b border-outline-variant/20">
                
                {/* Colonne 1 : Marque & Slogan (4 cols) */}
                <div className="lg:col-span-4 space-y-3">
                  <div className="flex items-center gap-3">
                    <img src="assets/logo.jpg" alt="Logo Crokéa" className="w-10 h-10 rounded-full object-cover mix-blend-multiply border border-primary/20 shadow-xs" />
                    <div>
                      <span className="font-title-editorial text-2xl uppercase tracking-[0.14em] text-primary font-bold block leading-none">CROKÉA</span>
                      <span className="text-[10px] uppercase font-bold text-tertiary-container tracking-wider">Crochet &amp; Perles Fait Main</span>
                    </div>
                  </div>
                  <p className="text-xs leading-relaxed max-w-sm">
                    🧶 Crokéa, c’est l’art du fait main au service de ta féminité. Des boucles d’oreilles artisanales d'une légèreté plume créées à Cotonou pour sublimer ton éclat au quotidien.
                  </p>
                  <p className="font-headline-sm text-xs italic text-primary">
                    « Tu n’as pas besoin d’attendre une occasion pour mettre cette tenue que tu aimes. 💙 »
                  </p>
                </div>

                {/* Colonne 2 : Liens Rapides (2 cols) */}
                <div className="lg:col-span-2 space-y-2.5 text-xs">
                  <p className="font-bold text-primary uppercase tracking-wider text-[11px]">Navigation</p>
                  <ul className="space-y-1.5 font-medium">
                    <li><a href="#accueil" className="hover:text-primary transition-colors">Accueil</a></li>
                    <li><a href="#equipe" className="hover:text-primary transition-colors">Notre Histoire</a></li>
                    <li><a href="#boutique" className="hover:text-primary transition-colors">La Boutique</a></li>
                    <li><a href="#temoignages" className="hover:text-primary transition-colors">Avis Clientes</a></li>
                    <li><a href="#contact" className="hover:text-primary transition-colors">Contact</a></li>
                  </ul>
                </div>

                {/* Colonne 3 : Légal & Modalités (3 cols) */}
                <div className="lg:col-span-3 space-y-2.5 text-xs">
                  <p className="font-bold text-primary uppercase tracking-wider text-[11px]">Informations</p>
                  <ul className="space-y-1.5 font-medium">
                    <li><button onClick={() => setTermsModal('livraison')} className="hover:text-primary transition-colors text-left">Livraison payante (à charge client)</button></li>
                    <li><button onClick={() => setTermsModal('cgv')} className="hover:text-primary transition-colors text-left">Conditions de Vente (CGV)</button></li>
                    <li><button onClick={() => setTermsModal('mentions')} className="hover:text-primary transition-colors text-left">Mentions Légales &amp; Atelier</button></li>
                  </ul>
                </div>

                {/* Colonne 4 : Contact Direct (3 cols) */}
                <div className="lg:col-span-3 space-y-2.5 text-xs">
                  <p className="font-bold text-primary uppercase tracking-wider text-[11px]">Atelier à Cotonou</p>
                  <p className="font-mono font-bold text-primary text-xs">{CROKEA_CONFIG.whatsappNumberFormatted}</p>
                  <p className="font-mono font-bold text-primary text-xs">{CROKEA_CONFIG.whatsappDirectNumberFormatted}</p>
                  <div className="pt-2 flex items-center gap-2">
                    <a
                      href={CROKEA_CONFIG.facebookUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container hover:bg-surface-container-highest text-primary font-bold text-[11px] transition-colors"
                    >
                      <span className="material-symbols-outlined text-[15px] text-blue-700">public</span>
                      <span>Page Facebook</span>
                    </a>
                  </div>
                </div>

              </div>

              {/* Ligne Copyright & Signature Concepteur */}
              <div className="pt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-on-surface-variant">
                <p>© 2025 CROKÉA. Tous droits réservés.</p>
                
                {/* Signature Amour Govoetchan */}
                <div>
                  <p className="inline-flex items-center gap-1.5 bg-surface-container/70 px-3.5 py-1.5 rounded-full border border-outline-variant/30 shadow-xs">
                    <span>Conception et déploiement par</span>
                    <a
                      href={CROKEA_CONFIG.developerFacebookUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="font-bold text-primary hover:text-tertiary underline decoration-primary/40 underline-offset-2 transition-colors inline-flex items-center gap-0.5"
                    >
                      <span>{CROKEA_CONFIG.developerName}</span>
                      <span className="material-symbols-outlined text-[13px]">open_in_new</span>
                    </a>
                  </p>
                </div>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Montage React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CrokeaApp />);
  </script>
</body>
</html>
